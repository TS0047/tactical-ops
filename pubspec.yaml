name: tactical_ops
description: Tactical productivity app — briefings, objectives, debriefs.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.3
  firebase_messaging: ^15.1.3

  # State management
  flutter_riverpod: ^3.0.0
  riverpod_annotation: ^4.0.0

  # Routing
  go_router: ^14.2.7

  # Notifications
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4

  # Data / serialization
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0

  # UI
  google_fonts: ^6.2.1
  flutter_slidable: ^3.1.1

  # Utilities
  intl: ^0.20.1
  uuid: ^4.4.2
  shared_preferences: ^2.3.2
  connectivity_plus: ^6.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.15.0
  freezed: ^3.0.0
  json_serializable: ^6.8.0
  riverpod_generator: ^4.0.0

flutter:
  uses-material-design: true
